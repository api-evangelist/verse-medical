description: 'Verse Medical is a software-driven durable medical equipment (DME) supplier delivering
  hospital-quality healthcare at home across the United States. Founded in 2018 (Y Combinator S18) and
  based in New York City, the company builds software that replaces fax-based ordering so doctors and
  clinics can prescribe, order, and manage medical supplies such as catheters, wound dressings, and
  diabetes supplies for patients at home. Backed by General Catalyst, SignalFire, Sapphire Ventures,
  Abstract Ventures, and Y Combinator. No public developer API, docs portal, or specification surface
  was found during enrichment; this profile carries company identity plus a probed domain-security
  posture.'
